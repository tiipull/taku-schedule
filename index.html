function createView(){var today=iso(new Date()),end=iso(new Date(Date.now()+90*86400000));hostMonth=monthKey(today);app.innerHTML='<section class="card"><h1>卓あわせ</h1><p class="muted">卓名・期間・必要時間を設定して作成します。</p><p class="muted">参加可能時間から候補日時を算出します。メモは候補計算に含まれません。</p><div class="grid"><div class="field"><label>卓名</label><input id="title" maxlength="200" placeholder="例：CoC『タイトル』"></div><div class="field"><label>卓の説明・募集要項（任意）</label><textarea id="description" maxlength="4000" rows="4" placeholder="シナリオ概要、募集人数、使用システム、注意事項など"></textarea></div><div class="field"><label>必要な総プレイ時間（時間）</label><input id="hours" type="number" min=".5" step=".5" value="4"></div><div class="field"><label>開始日</label><input id="start" type="date" value="'+today+'"></div><div class="field"><label>終了日</label><input id="end" type="date" value="'+end+'"></div></div></section><section class="card exclusion-area"><h2>日程から除外する日</h2><p class="muted">選択した日は終日、候補から除外されます。</p><p class="muted">カレンダーで選べるのは、上の「開始日」から「終了日」までです。初期設定では今日から約3か月先までを対象にしています。必要に応じて終了日を変更してください。</p><div class="selection-help">日付を選択して除外します。</div><div id="host-calendar"></div><div id="host-exclusion-list"></div><p><button class="primary" id="create">日程調整ページを生成</button></p></section>'+managerView();document.getElementById('create').onclick=createSchedule;['start','end'].forEach(function(id){document.getElementById(id).addEventListener('change',function(){hostSelectedDays=[];renderHostCalendar()})});renderHostCalendar()}
function getManaged(){try{return JSON.parse(localStorage.getItem('taku-managed-schedules')||'[]')}catch(e){return []}}function saveManaged(list){localStorage.setItem('taku-managed-schedules',JSON.stringify(list))}function getParticipated(){try{return JSON.parse(localStorage.getItem('taku-participated-schedules')||'[]')}catch(e){return []}}function saveParticipated(list){localStorage.setItem('taku-participated-schedules',JSON.stringify(list))}function rememberParticipated(){if(!S||!shareId||!me)return;var list=getParticipated(),old=list.findIndex(function(x){return x.share_id===shareId});var item={share_id:shareId,title:S.title,start_date:S.start_date,end_date:S.end_date,person_name:me.name};if(old>=0)list[old]=item;else list.unshift(item);saveParticipated(list)}function managerView(){var list=getManaged(),joined=getParticipated();return '<section class="card manager"><h2>作成した日程を管理</h2><p class="muted">一覧はこのブラウザに保存されます。URLは別の場所にも保存し、主催者編集URLは共有しないでください。</p>'+(list.map(function(x,i){return '<div class="line"><span><strong>'+esc(x.title)+'</strong><br><small>'+esc(x.start_date)+' ～ '+esc(x.end_date)+'</small></span><span><button data-open-share="'+i+'">参加者用</button> <button data-open-edit="'+i+'">主催者編集</button> <button class="danger" data-remove-managed="'+i+'">一覧から削除</button></span></div>'}).join('')||'<p class="muted">まだ作成した卓はありません。</p>')+'</section><section class="card manager"><h2>参加・入力した日程を管理</h2><p class="muted">参加登録した卓をこのブラウザに保存します。</p>'+(joined.map(function(x,i){return '<div class="line"><span><strong>'+esc(x.title)+'</strong><br><small>'+esc(x.start_date)+' ～ '+esc(x.end_date)+'　／　入力名：'+esc(x.person_name||'')+'</small></span><span><button data-open-joined="'+i+'">日程を開く</button> <button class="danger" data-remove-joined="'+i+'">一覧から削除</button></span></div>'}).join('')||'<p class="muted">まだ参加・入力した卓はありません。参加者用URLを開き、名前を登録するとここに保存されます。</p>')+'</section>'}function renderHostCalendar(){var start=document.getElementById('start').value,end=document.getElementById('end').value,valid=start&&end&&end>=start?dates(start,end):[];if(!valid.length){document.getElementById('host-calendar').innerHTML='<p class="muted">開始日と終了日を正しく設定してください。</p>';return}if(!hostMonth||hostMonth<monthKey(start)||hostMonth>monthKey(end))hostMonth=monthKey(start);document.getElementById('host-calendar').innerHTML=calendarHtml(hostMonth,valid,hostSelectedDays,function(d){return hostDayMarkup(d)} ,'host');document.getElementById('host-exclusion-list').innerHTML='<h3>除外する日（'+hostExcluded.length+'件）</h3>'+(hostExcluded.map(function(x,i){return '<div class="line"><span>'+x.day+'　終日除外</span><button data-host-remove="'+i+'">戻す</button></div>'}).join('')||'<p class="muted">まだ設定されていません。</p>')}
