<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卓日程調整</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#20242a;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}main{max-width:900px;margin:auto;padding:16px}.card{background:white;border:1px solid #dddfe4;border-radius:14px;padding:18px;margin:12px 0}input,textarea,select,button{font:inherit;padding:10px;border:1px solid #cbd0d7;border-radius:8px;max-width:100%}input,textarea,select{width:100%}button{cursor:pointer;background:#fff}.primary{background:#222831;color:white;border:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.field label{display:block;font-weight:650;font-size:14px;margin-bottom:5px}.tabs,.modes{display:flex;flex-wrap:wrap;gap:8px}.active{background:#222831;color:white}.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px}.day{min-height:60px}.line{padding:9px 0;border-bottom:1px solid #eee;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}.chip{display:inline-block;border-radius:12px;padding:4px 8px;margin:2px;background:#eee;font-size:13px}.muted{color:#66707c}.share{overflow-wrap:anywhere;background:#f0f2f5;padding:10px;border-radius:8px}@media(max-width:560px){main{padding:8px}.card{padding:13px}}
</style></head><body><main id="app"></main><script>
(function(){
var cfg=window.SUPABASE_CONFIG||{};
var db=window.supabase&&cfg.url&&cfg.anonKey?window.supabase.createClient(cfg.url,cfg.anonKey):null;
var palette=['#5b6ee1','#d05b8b','#2b9b72','#d08a32','#7656a8','#248ea8','#b64f4f','#5c7d3f','#a25a9a','#4d6b8c'];
var shareId=new URLSearchParams(location.search).get('id'),app=document.getElementById('app');
var S=null,people=[],data={availability:[],busy_periods:[],notes:[]},me=null,mode='availability',day=null,tab='mine';
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function call(name,args){return db.rpc(name,args).then(function(r){if(r.error)throw r.error;return r.data})}
function fmt(m){return Math.floor(m/60)+':'+String(m%60).padStart(2,'0')}
function dates(a,b){var r=[],d=new Date(a+'T12:00:00'),e=new Date(b+'T12:00:00');for(;d<=e;d.setDate(d.getDate()+1))r.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));return r}
function times(){return Array.from({length:55},function(_,i){return i*30})}
function token(){return localStorage.getItem('taku-token-'+shareId)}
function personId(){return localStorage.getItem('taku-person-'+shareId)}
function fail(e){alert(e&&e.message?e.message:String(e))}
function init(){if(!db){app.innerHTML='<section class="card"><h1>接続設定が必要です</h1><p>config.js にSupabaseのProject URLとPublishable keyを設定してください。</p></section>';return}if(shareId)load();else createView()}
function createView(){app.innerHTML='<section class="card"><h1>卓日程調整</h1><p>卓名、日程調整期間、必要な総プレイ時間を設定します。</p><div class="grid"><div class="field"><label>卓名</label><input id="title" maxlength="200" placeholder="例：CoC『タイトル』"></div><div class="field"><label>必要な総プレイ時間（時間）</label><input id="hours" type="number" min=".5" step=".5" value="4"></div><div class="field"><label>開始日</label><input id="start" type="date"></div><div class="field"><label>終了日</label><input id="end" type="date"></div></div><p><button class="primary" id="create">日程調整ページを生成</button></p></section>';document.getElementById('create').onclick=createSchedule}
function createSchedule(){var title=document.getElementById('title').value.trim(),start=document.getElementById('start').value,end=document.getElementById('end').value,h=Number(document.getElementById('hours').value);if(!title||!start||!end||end<start||!h)return alert('入力内容を確認してください');call('create_schedule',{p_title:title,p_start_date:start,p_end_date:end,p_required_minutes:Math.round(h*60)}).then(function(s){location.href='?id='+encodeURIComponent(s.share_id)}).catch(fail)}
function load(){app.innerHTML='<section class="card">読み込み中…</section>';call('get_schedule',{p_share_id:shareId}).then(function(d){S=d.schedule;people=d.participants||[];data={availability:d.availability||[],busy_periods:d.busy_periods||[],notes:d.notes||[]};me=people.find(function(p){return p.id===personId()})||null;if(me&&!token())me=null;render()}).catch(function(e){app.innerHTML='<section class="card"><h2>卓を読み込めません</h2><p>'+esc(e.message)+'</p><p>共有URLとSupabase設定を確認してください。</p></section>'})}
function render(){if(!S)return;app.innerHTML='<section class="card"><h1>'+esc(S.title)+'</h1><p>'+S.start_date+' ～ '+S.end_date+'　｜　必要時間 '+(S.required_minutes/60)+'時間</p><div class="share">'+esc(location.href)+' <button id="copy">URLをコピー</button></div></section><section class="card tabs"><button data-tab="mine" class="'+(tab==='mine'?'active':'')+'">自分の回答</button><button data-tab="all" class="'+(tab==='all'?'active':'')+'">全員の回答</button><button data-tab="candidate" class="'+(tab==='candidate'?'active':'')+'">候補日時</button></section>'+ (tab==='mine'?mineView():tab==='all'?allView():candidateView());document.getElementById('copy').onclick=function(){navigator.clipboard.writeText(location.href).then(function(){alert('URLをコピーしました')}).catch(fail)};Array.from(document.querySelectorAll('[data-tab]')).forEach(function(b){b.onclick=function(){tab=b.dataset.tab;render()}})}
function mineView(){if(!me)return '<section class="card"><h2>参加者として回答</h2><div class="field"><label>名前</label><input id="pname" maxlength="80" placeholder="PL名・ハンドルネーム"></div><p><button class="primary" id="join">回答を開始</button></p></section>';return '<section class="card"><h2>'+esc(me.name)+' の回答</h2><div class="modes"><button data-mode="availability" class="'+(mode==='availability'?'active':'')+'">参加可能時間</button><button data-mode="busy_periods" class="'+(mode==='busy_periods'?'active':'')+'">予定（入力不可）</button><button data-mode="notes" class="'+(mode==='notes'?'active':'')+'">自由記載</button></div><p class="muted">日付を選び、30分単位で時間を登録できます。時刻は27:00まで入力可能です。</p><div class="days">'+dates(S.start_date,S.end_date).map(function(d){return '<button class="day '+(day===d?'active':'')+'" data-day="'+d+'">'+d+'</button>'}).join('')+'</div>'+(day?editor():'')+'<h3>自分の登録</h3>'+myEntries()+'</section>'}
function join(){var name=document.getElementById('pname').value.trim();if(!name)return alert('名前を入力してください');var tok=Array.from(crypto.getRandomValues(new Uint8Array(32))).map(function(x){return x.toString(16).padStart(2,'0')}).join('');call('join_schedule',{p_share_id:shareId,p_name:name,p_edit_token:tok,p_color_index:people.length%palette.length}).then(function(p){localStorage.setItem('taku-token-'+shareId,tok);localStorage.setItem('taku-person-'+shareId,p.id);load()}).catch(fail)}
function editor(){if(mode==='notes')return '<div class="card"><label>自由記載（'+day+'）</label><textarea id="note" maxlength="2000" rows="3" placeholder="自由記載"></textarea><p><button class="primary" id="save-note">保存</button></p></div>';return '<div class="card"><h3>'+day+'</h3><div class="grid"><div class="field"><label>開始</label><select id="st">'+times().map(function(t){return '<option value="'+t+'">'+fmt(t)+'</option>'}).join('')+'</select></div><div class="field"><label>終了</label><select id="en">'+times().map(function(t){return '<option value="'+t+'" '+(t===120?'selected':'')+'>'+fmt(t)+'</option>'}).join('')+'</select></div></div><p><button class="primary" id="add-range">時間を追加</button></p></div>'}
function myEntries(){var rows=[];['availability','busy_periods','notes'].forEach(function(k){data[k].filter(function(x){return x.participant_id===me.id}).forEach(function(x){rows.push('<div class="line"><span>'+x.day+'　'+(k==='notes'?esc(x.text):(k==='availability'?'参加可能':'予定')+' '+fmt(x.start_minute)+'～'+fmt(x.end_minute))+'</span><button data-delete="'+k+'" data-id="'+x.id+'">削除</button></div>')})});return rows.join('')||'<p class="muted">まだ回答がありません。</p>'}
function addRange(){var st=Number(document.getElementById('st').value),en=Number(document.getElementById('en').value);if(en<=st)return alert('終了は開始より後にしてください');if(mode==='availability'&&data.busy_periods.some(function(x){return x.participant_id===me.id&&x.day===day&&st<x.end_minute&&en>x.start_minute}))return alert('登録済みの予定と重なっています');call('add_time_entry',{p_share_id:shareId,p_participant_id:me.id,p_edit_token:token(),p_kind:mode,p_day:day,p_start_minute:st,p_end_minute:en}).then(load).catch(fail)}
function addNote(){call('add_note',{p_share_id:shareId,p_participant_id:me.id,p_edit_token:token(),p_day:day,p_text:document.getElementById('note').value}).then(load).catch(fail)}
function deleteEntry(k,id){if(!confirm('この登録を削除しますか？'))return;call('delete_own_entry',{p_share_id:shareId,p_participant_id:me.id,p_edit_token:token(),p_kind:k,p_entry_id:id}).then(load).catch(fail)}
function allView(){return '<section class="card"><h2>全員の回答</h2>'+dates(S.start_date,S.end_date).map(function(d){var html=people.map(function(p){var a=data.availability.filter(function(x){return x.participant_id===p.id&&x.day===d}),b=data.busy_periods.filter(function(x){return x.participant_id===p.id&&x.day===d}),n=data.notes.filter(function(x){return x.participant_id===p.id&&x.day===d});if(!a.length&&!b.length&&!n.length)return '';return '<div class="line"><strong><span style="color:'+palette[p.color_index%palette.length]+'">●</span> '+esc(p.name)+'</strong><span>'+a.map(function(x){return '<span class="chip" style="background:'+palette[p.color_index%palette.length]+'22">参加可能 '+fmt(x.start_minute)+'～'+fmt(x.end_minute)+'</span>'}).join('')+b.map(function(x){return '<span class="chip">予定 '+fmt(x.start_minute)+'～'+fmt(x.end_minute)+'</span>'}).join('')+n.map(function(x){return '<span class="chip" style="background:'+palette[p.color_index%palette.length]+'22">'+esc(x.text)+'</span>'}).join('')+'</span></div>'}).join('');return html?'<h3>'+d+'</h3>'+html:''}).join('')+'</section>'}
function candidateView(){var out=[];if(!people.length)return '<section class="card">参加者の回答がまだありません。</section>';dates(S.start_date,S.end_date).forEach(function(d){var per=people.map(function(p){return data.availability.filter(function(x){return x.participant_id===p.id&&x.day===d}).map(function(x){return [x.start_minute,x.end_minute]})});if(per.some(function(x){return !x.length}))return;var pts=Array.from(new Set([].concat.apply([],per.map(function(xs){return [].concat.apply([],xs)})))).sort(function(a,b){return a-b});for(var i=0;i<pts.length-1;i++){var a=pts[i],b=pts[i+1];if(per.every(function(xs){return xs.some(function(v){return v[0]<=a&&v[1]>=b})})){var last=out[out.length-1];if(last&&last.day===d&&last.end===a)last.end=b;else out.push({day:d,start:a,end:b})}}});var total=out.reduce(function(n,x){return n+x.end-x.start},0);return '<section class="card"><h2>全員の共通時間</h2><p>必要 '+S.required_minutes/60+'時間 ／ 共通時間合計 '+total/60+'時間</p>'+out.map(function(x){return '<div class="line"><strong>'+x.day+'</strong><span>'+fmt(x.start)+'～'+fmt(x.end)+'（'+(x.end-x.start)/60+'時間）</span></div>'}).join('')+'</section>'}
document.addEventListener('click',function(e){var m=e.target.closest('[data-mode]'),d=e.target.closest('[data-day]'),del=e.target.closest('[data-delete]');if(m){mode=m.dataset.mode;render()}if(d){day=d.dataset.day;render()}if(del)deleteEntry(del.dataset.delete,del.dataset.id);if(e.target.id==='join')join();if(e.target.id==='add-range')addRange();if(e.target.id==='save-note')addNote()});
init();
})();
</script></main></body></html>
