<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卓あわせ｜TRPG日程調整ツール</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#edf8f0 0%,#f3faf5 48%,#f8fcf8 100%);color:#26372d;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}main{max-width:1100px;margin:auto;padding:20px}h1{font-size:clamp(1.8rem,4vw,2.5rem);letter-spacing:.025em;line-height:1.25;margin:.2em 0 .55em}h2{font-size:clamp(1.25rem,2.5vw,1.65rem);letter-spacing:.015em}h3{font-size:1.05rem}body{font-family:"Yu Gothic UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.65}.card{background:white;border:1px solid #d4e4d8;border-radius:14px;padding:18px;margin:12px 0}input,textarea,select,button{font:inherit;padding:10px;border:1px solid #c7d8cc;border-radius:8px;max-width:100%}input,textarea,select{width:100%}button{cursor:pointer;background:white;color:#20242a}.primary{background:linear-gradient(120deg,#268451,#46a66b);color:white;border:0;box-shadow:0 3px 8px rgba(38,132,81,.2)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.field label{display:block;font-weight:650;font-size:14px;margin-bottom:5px}.tabs,.modes,.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.active{background:#287d4d!important;color:white!important;border-color:#287d4d!important;box-shadow:0 3px 9px rgba(40,125,77,.18)}.mode-availability{border-color:#80c9a0;color:#206b43;background:#edf9f1}.mode-exclusion{border-color:#c5c9d0;color:#5d6570;background:#f0f1f3}.mode-notes{border-color:#b7a3e7;color:#6342a2;background:#f4efff}.mode-availability.active{background:#287d52!important;border-color:#287d52!important}.mode-exclusion.active{background:#6f7782!important;border-color:#6f7782!important}.mode-notes.active{background:#7356b5!important;border-color:#7356b5!important}.muted{color:#66707c}.share{overflow-wrap:anywhere;background:#eef5ef;padding:10px;border-radius:8px}.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;font-size:13px;color:#68717c;padding:5px}.calday{min-width:0;min-height:105px;padding:7px 5px;text-align:left;display:flex;flex-direction:column;align-items:stretch;gap:4px;border:1px solid #d4e4d8;background:#fff}.calday.empty{visibility:hidden}.calday.outside{opacity:.4}.calday.selected{outline:3px solid #3b9b62;outline-offset:-3px;background:#eaf7ee}.calday .num{font-weight:700}.calday .mini{font-size:11px;line-height:1.35;border-radius:5px;padding:3px;overflow-wrap:anywhere}.mini.avail{background:#dff5e8;color:#205f3d;border-left:3px solid #54b77c}.mini.overlap{background:#ffe0e0!important;color:#a32626!important;border:1px solid #e59b9b;font-weight:700}.mini.exclusion{background:#e1e3e7;color:#555d67}.mini.note{background:#eee5ff;color:#5c4093;border-left:3px solid #9b7be0}.mini.person{background:#e0f0e4;color:#28643a}.mini.more{background:#f0f2f5;color:#5d6570}.selection-help{background:linear-gradient(110deg,#edf8ef,#f3faf5);border:1px solid #d5e8da;border-radius:10px;padding:12px;margin:10px 0}.line{padding:10px 12px;border-bottom:1px solid #eee;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}.chip{display:inline-block;border-radius:8px;padding:4px 8px;margin:2px;background:#eee;font-size:13px}.entry-list{margin-top:14px}.note-area{border-left:4px solid #3d9960;background:#f8fcf9}.exclusion-area{border-left:4px solid #7d858f;background:linear-gradient(135deg,#fff,#f7f7fa)}.availability-area{border-left:4px solid #2b9b62}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}.legend span{display:flex;align-items:center;gap:5px}.dot{width:10px;height:10px;border-radius:3px;display:inline-block}.danger{color:#9e3434;border-color:#d9a4a4}.line.overlap{background:#fff0f0;border:1px solid #efaaaa;border-radius:8px;color:#a32626}.warning{background:#fff0f0;border:1px solid #efaaaa;color:#a32626;border-radius:10px;padding:10px 12px;margin:10px 0}.manager{background:linear-gradient(120deg,#edf8ef,#f2faf4);border:1px solid #d5e8da}.entry-time{font-variant-numeric:tabular-nums;font-weight:650}.organizer-banner{background:#fff7df;border:1px solid #f0d78b;border-radius:10px;padding:12px}.hidden{display:none!important}@media(max-width:620px){main{padding:7px}.card{padding:12px}.calday{min-height:78px;padding:4px 2px}.calday .mini{font-size:9px;padding:2px}.weekday{font-size:11px}.calday .num{font-size:12px}.calendar{gap:3px}}
</style></head><body><main id="app"></main><script>
(function(){
var cfg=window.SUPABASE_CONFIG||{},db=window.supabase&&cfg.url&&cfg.anonKey?window.supabase.createClient(cfg.url,cfg.anonKey):null;
var palette=['#5b6ee1','#d05b8b','#2b9b72','#d08a32','#7656a8','#248ea8','#b64f4f','#5c7d3f','#a25a9a','#4d6b8c'];
var params=new URLSearchParams(location.search),shareId=params.get('id'),editToken=params.get('edit'),app=document.getElementById('app');
var S=null,people=[],data={availability:[],busy_periods:[],notes:[],exclusions:[]},me=null,mode='availability',tab='mine',viewMonth='',selectedDays=[],hostExcluded=[],hostSelectedDays=[],hostMonth='',rangeStart=Number(localStorage.getItem('taku-default-start')||0),rangeEnd=Number(localStorage.getItem('taku-default-end')||120),hostStart=0,hostEnd=120,organizerMode=false,editDays=[],selectedCandidateKeys=[],candidateCache=[];
var builtinPresets=[{name:'朝卓',start:600,end:720},{name:'昼卓',start:780,end:1020},{name:'夜卓',start:1260,end:1440}];
function getPresets(){try{return builtinPresets.concat(JSON.parse(localStorage.getItem('taku-time-presets')||'[]'))}catch(e){return builtinPresets.slice()}}
function saveCurrentPreset(){var name=prompt('この時間設定の名前（例：短め夜卓、休日卓）');if(!name||!name.trim())return;var list=[];try{list=JSON.parse(localStorage.getItem('taku-time-presets')||'[]')}catch(e){}list.push({name:name.trim().slice(0,30),start:rangeStart,end:rangeEnd});localStorage.setItem('taku-time-presets',JSON.stringify(list));render()}
function applyPreset(index){var p=getPresets()[index];if(!p)return;rangeStart=p.start;rangeEnd=p.end;localStorage.setItem('taku-default-start',String(rangeStart));localStorage.setItem('taku-default-end',String(rangeEnd));render()}
function removePreset(index){if(index<builtinPresets.length)return;if(!confirm('この時間プリセットを削除しますか？'))return;var list=[];try{list=JSON.parse(localStorage.getItem('taku-time-presets')||'[]')}catch(e){}list.splice(index-builtinPresets.length,1);localStorage.setItem('taku-time-presets',JSON.stringify(list));render()}
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function call(name,args){return db.rpc(name,args).then(function(r){if(r.error)throw r.error;return r.data})}
function fmt(m){return Math.floor(m/60)+':'+String(m%60).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dates(a,b){var r=[],d=new Date(a+'T12:00:00'),e=new Date(b+'T12:00:00');for(;d<=e;d.setDate(d.getDate()+1))r.push(iso(d));return r}
function times(){return Array.from({length:55},function(_,i){return i*30})}
function token(){return localStorage.getItem('taku-token-'+shareId)}function personId(){return localStorage.getItem('taku-person-'+shareId)}
function fail(e){alert(e&&e.message?e.message:String(e))}
function monthKey(d){return d.slice(0,7)}function shiftMonth(key,delta){var p=key.split('-').map(Number),d=new Date(p[0],p[1]-1+delta,1,12);return iso(d).slice(0,7)}
function monthDates(key){var p=key.split('-').map(Number),first=new Date(p[0],p[1]-1,1,12),offset=first.getDay(),last=new Date(p[0],p[1],0,12).getDate(),r=[];for(var i=0;i<offset;i++)r.push('');for(var n=1;n<=last;n++)r.push(iso(new Date(p[0],p[1]-1,n,12)));while(r.length%7)r.push('');return r}
function init(){if(!db){app.innerHTML='<section class="card"><h1>接続設定が必要です</h1><p>config.js のSupabase設定を確認してください。</p></section>';return}if(shareId)load();else createView()}
function createView(){var today=iso(new Date()),end=iso(new Date(Date.now()+21*86400000));hostMonth=monthKey(today);app.innerHTML='<section class="card"><h1>卓あわせ</h1><p>みんなの予定を合わせて、次のセッションへ。</p><p class="muted">TRPGの日程調整ツール</p><p>卓名・調整期間・必要時間と、卓全体で除外する日時を設定します。</p><div class="grid"><div class="field"><label>卓名</label><input id="title" maxlength="200" placeholder="例：CoC『タイトル』"></div><div class="field"><label>必要な総プレイ時間（時間）</label><input id="hours" type="number" min=".5" step=".5" value="4"></div><div class="field"><label>開始日</label><input id="start" type="date" value="'+today+'"></div><div class="field"><label>終了日</label><input id="end" type="date" value="'+end+'"></div></div></section><section class="card exclusion-area"><h2>日程から除外する日</h2><p class="muted">主催者がここで選んだ日は終日、参加者のカレンダーと候補日時から除外されます。</p><p class="muted">日付を選ぶだけで、その日を丸ごと候補から外します。時刻の指定は不要です。</p><div class="selection-help">① 下のカレンダーで日付を複数選択　②「選択した日付を除外する」</div><div id="host-calendar"></div><div id="host-exclusion-list"></div><p><button class="primary" id="create">日程調整ページを生成</button></p></section>'+managerView();document.getElementById('create').onclick=createSchedule;['start','end'].forEach(function(id){document.getElementById(id).addEventListener('change',function(){hostSelectedDays=[];renderHostCalendar()})});renderHostCalendar()}
function getManaged(){try{return JSON.parse(localStorage.getItem('taku-managed-schedules')||'[]')}catch(e){return []}}function saveManaged(list){localStorage.setItem('taku-managed-schedules',JSON.stringify(list))}function managerView(){var list=getManaged();return '<section class="card manager"><h2>作成した日程を管理</h2><p class="muted">このブラウザで作成した卓のリンク一覧です。編集用URLは主催者専用なので、参加者には共有しないでください。</p>'+(list.map(function(x,i){return '<div class="line"><span><strong>'+esc(x.title)+'</strong><br><small>'+esc(x.start_date)+' ～ '+esc(x.end_date)+'</small></span><span><button data-open-share="'+i+'">参加者用</button> <button data-open-edit="'+i+'">主催者編集</button> <button data-remove-managed="'+i+'">一覧から削除</button></span></div>'}).join('')||'<p class="muted">まだ作成した卓はありません。このブラウザで作成すると、ここに表示されます。</p>')+'</section>'}function renderHostCalendar(){var start=document.getElementById('start').value,end=document.getElementById('end').value,valid=start&&end&&end>=start?dates(start,end):[];if(!valid.length){document.getElementById('host-calendar').innerHTML='<p class="muted">開始日と終了日を正しく設定してください。</p>';return}if(!hostMonth||hostMonth<monthKey(start)||hostMonth>monthKey(end))hostMonth=monthKey(start);document.getElementById('host-calendar').innerHTML=calendarHtml(hostMonth,valid,hostSelectedDays,function(d){return hostDayMarkup(d)} ,'host');document.getElementById('host-exclusion-list').innerHTML='<h3>除外する日（'+hostExcluded.length+'件）</h3>'+(hostExcluded.map(function(x,i){return '<div class="line"><span>'+x.day+'　終日除外</span><button data-host-remove="'+i+'">戻す</button></div>'}).join('')||'<p class="muted">まだ設定されていません。</p>')}
function hostDayMarkup(d){var xs=hostExcluded.filter(function(x){return x.day===d});return xs.length?'<span class="mini exclusion">終日除外</span>':''}
function calendarHtml(mkey,valid,selected,markup,kind){var arr=monthDates(mkey),title=mkey.replace('-','年')+'月',out='<div class="calendar-head"><button data-month="'+kind+'" data-delta="-1">‹ 前月</button><strong>'+title+'</strong><button data-month="'+kind+'" data-delta="1">翌月 ›</button></div><div class="calendar">'+['日','月','火','水','木','金','土'].map(function(w){return '<div class="weekday">'+w+'</div>'}).join('');arr.forEach(function(d){if(!d){out+='<div class="calday empty"></div>';return}var inRange=valid.indexOf(d)>=0,sel=selected.indexOf(d)>=0;out+='<button class="calday '+(!inRange?'outside ':'')+(sel?'selected':'')+'" data-select-day="'+kind+'" data-day="'+d+'" '+(!inRange?'disabled':'')+'><span class="num">'+Number(d.slice(-2))+'</span>'+(inRange?markup(d):'')+'</button>'});return out+'</div>'}
function createSchedule(){var title=document.getElementById('title').value.trim(),start=document.getElementById('start').value,end=document.getElementById('end').value,h=Number(document.getElementById('hours').value);if(!title||!start||!end||end<start||!h)return alert('入力内容を確認してください');var outOfRange=hostExcluded.some(function(x){return x.day<start||x.day>end});if(outOfRange)return alert('除外日程に期間外の日付があります');call('create_schedule_with_exclusions',{p_title:title,p_start_date:start,p_end_date:end,p_required_minutes:Math.round(h*60),p_exclusions:hostExcluded.map(function(x){return {day:x.day}})}).then(function(s){var list=getManaged();list.unshift({share_id:s.share_id,title:s.title,start_date:s.start_date,end_date:s.end_date,required_minutes:s.required_minutes,organizer_token:s.organizer_token});saveManaged(list);location.href='?id='+encodeURIComponent(s.share_id)+'&edit='+encodeURIComponent(s.organizer_token)}).catch(function(e){alert('日程調整ページを生成できませんでした。Supabaseで supabase-exclusions.sql を実行済みか確認してください。\n'+(e.message||e))})}
function load(){app.innerHTML='<section class="card">読み込み中…</section>';call('get_schedule',{p_share_id:shareId}).then(function(d){S=d.schedule;people=d.participants||[];data={availability:d.availability||[],busy_periods:d.busy_periods||[],notes:d.notes||[],exclusions:d.exclusions||[]};me=people.find(function(p){return p.id===personId()})||null;if(me&&!token())me=null;organizerMode=!!editToken;if(organizerMode)editDays=data.exclusions.map(function(x){return x.day}).filter(function(v,i,a){return a.indexOf(v)===i});if(!viewMonth)viewMonth=monthKey(S.start_date);render()}).catch(function(e){app.innerHTML='<section class="card"><h2>卓を読み込めません</h2><p>'+esc(e.message)+'</p><p>共有URLとSupabase設定を確認してください。</p></section>'})}
function render(){if(!S)return;app.innerHTML='<section class="card"><h1>'+esc(S.title)+'</h1><p>'+S.start_date+' ～ '+S.end_date+'　｜　必要時間 '+(S.required_minutes/60)+'時間</p><div class="share">'+esc(location.href)+' <button id="copy">URLをコピー</button></div><p class="toolbar"><button id="back-home">作成ページ・管理一覧へ</button>'+(organizerMode?'<button class="primary" id="toggle-organizer">主催者編集を閉じる</button>':'')+'</p></section>'+(organizerMode?organizerView():'<section class="card tabs"><button data-tab="mine" class="'+(tab==='mine'?'active':'')+'">自分の日程</button><button data-tab="all" class="'+(tab==='all'?'active':'')+'">みんなの日程</button><button data-tab="candidate" class="'+(tab==='candidate'?'active':'')+'">候補日時</button></section>'+ (tab==='mine'?mineView():tab==='all'?allView():candidateView()));document.getElementById('copy').onclick=function(){navigator.clipboard.writeText(location.href).then(function(){alert('URLをコピーしました')}).catch(fail)};Array.from(document.querySelectorAll('[data-tab]')).forEach(function(b){b.onclick=function(){tab=b.dataset.tab;render()}})}
function organizerView(){var valid=dates(S.start_date,S.end_date);return '<section class="card exclusion-area"><div class="organizer-banner"><strong>主催者用の編集ページ</strong><br><span class="muted">日付をクリックして除外・解除できます。除外日は参加者の入力画面から消えます。</span></div><div class="grid"><div class="field"><label>卓名</label><input id="edit-title" maxlength="200" value="'+esc(S.title)+'"></div><div class="field"><label>必要な総プレイ時間（時間）</label><input id="edit-hours" type="number" min=".5" step=".5" value="'+(S.required_minutes/60)+'"></div><div class="field"><label>開始日</label><input id="edit-start" type="date" value="'+S.start_date+'"></div><div class="field"><label>終了日</label><input id="edit-end" type="date" value="'+S.end_date+'"></div></div><p class="muted">紫色の日付は除外日です。クリックで切り替えられます。</p>'+calendarHtml(viewMonth,valid,editDays.map(function(d){return d}),function(d){return editDays.indexOf(d)>=0?'<span class="mini exclusion">終日除外</span>':''},'edit')+'<p><button class="primary" id="save-organizer">変更を保存</button></p><p><button id="copy-participant">参加者用URLをコピー</button> <button id="copy-editor">編集用URLをコピー</button></p></section>'}function mineView(){if(!me)return '<section class="card"><h2>参加する名前を入力</h2><div class="field"><label>名前</label><input id="pname" maxlength="80" placeholder="PL名・ハンドルネーム"></div><p><button class="primary" id="join">この名前で参加する</button></p></section>';var valid=dates(S.start_date,S.end_date).filter(function(d){return !data.exclusions.some(function(x){return x.day===d})});return '<section class="card"><div class="toolbar"><h2 style="margin-right:auto">'+esc(me.name)+' の日程</h2><button class="danger" id="switch-person">参加する人を切り替える</button></div><div class="modes"><button data-mode="availability" class="mode-availability '+(mode==='availability'?'active':'')+'">参加可能時間</button><button data-mode="notes" class="mode-notes '+(mode==='notes'?'active':'')+'">自由記載</button></div><p class="muted">先に時間帯を設定し、カレンダーで日付を複数選択して一括登録できます。時刻は30分単位、最大27:00です。主催者が除外した日は、最初から選択できません。</p><div class="field"><label>時間プリセット（このブラウザに保存）</label><div class="toolbar">'+getPresets().map(function(p,i){return '<button data-time-preset="'+i+'" class="'+(p.start===rangeStart&&p.end===rangeEnd?'active':'')+'">'+esc(p.name)+'<br><small>'+fmt(p.start)+'～'+fmt(p.end)+'</small></button>'+(i>=builtinPresets.length?'<button class="danger" data-remove-preset="'+i+'">×</button>':'')}).join('')+'<button id="save-preset">＋ 今の時間を登録</button></div></div><div class="grid"><div class="field"><label>開始時刻</label><select id="st">'+times().map(function(t){return '<option value="'+t+'" '+(t===rangeStart?'selected':'')+'>'+fmt(t)+'</option>'}).join('')+'</select></div><div class="field"><label>終了時刻</label><select id="en">'+times().map(function(t){return '<option value="'+t+'" '+(t===rangeEnd?'selected':'')+'>'+fmt(t)+'</option>'}).join('')+'</select></div></div><div class="selection-help"><strong>選択中の日付：'+selectedDays.length+'日</strong><br>カレンダー上の日付をクリックして選択・解除します。時間を決めてから、まとめて登録してください。</div><div class="toolbar"><button id="clear-selection">選択を解除</button><button class="primary" id="bulk-add">選択した日付に参加可能時間を追加</button></div><div class="legend"><span><i class="dot" style="background:#bfe8ce"></i>参加可能時間</span><span><i class="dot" style="background:#e3dcff"></i>自由記載</span></div>'+calendarHtml(viewMonth,valid,selectedDays,function(d){return dayMarkup(d)},'mine')+(mode==='notes'?'<div class="card note-area"><h3>自由記載を追加</h3><p class="muted">日付を1日選択してください。自由記載は候補時間の計算に含まれません。</p><textarea id="note" maxlength="2000" rows="3" placeholder="メモ・備考"></textarea><p><button class="mode-notes" id="save-note">自由記載を保存</button></p></div>':'')+'<div class="entry-list"><h3>入力した日程</h3>'+myEntries()+'</div></section>'}
function dayMarkup(d){var xs=[],own=data.availability.filter(function(x){return x.participant_id===me.id&&x.day===d});own.forEach(function(x){var overlap=hasOverlap(x,own);xs.push('<span class="mini '+(overlap?'overlap':'avail')+'">'+(overlap?'⚠ ':'')+fmt(x.start_minute)+'–'+fmt(x.end_minute)+'</span>')});data.notes.filter(function(x){return x.participant_id===me.id&&x.day===d}).forEach(function(x){xs.push('<span class="mini note">メモあり</span>')});return xs.slice(0,3).join('')+(xs.length>3?'<span class="mini more">+'+(xs.length-3)+'</span>':'')}
function join(){var name=document.getElementById('pname').value.trim();if(!name)return alert('名前を入力してください');var tok=Array.from(crypto.getRandomValues(new Uint8Array(32))).map(function(x){return x.toString(16).padStart(2,'0')}).join('');call('join_schedule',{p_share_id:shareId,p_name:name,p_edit_token:tok,p_color_index:people.length%palette.length}).then(function(p){localStorage.setItem('taku-token-'+shareId,tok);localStorage.setItem('taku-person-'+shareId,p.id);selectedDays=[];load()}).catch(fail)}
function hasOverlap(x,all){return all.some(function(y){return y.id!==x.id&&y.day===x.day&&x.start_minute<y.end_minute&&x.end_minute>y.start_minute})}function myEntries(){var own=data.availability.filter(function(x){return x.participant_id===me.id}).slice(),notes=data.notes.filter(function(x){return x.participant_id===me.id}).slice(),items=[];own.forEach(function(x){items.push({day:x.day,minute:x.start_minute,kind:'availability',item:x,overlap:hasOverlap(x,own)})});notes.forEach(function(x){items.push({day:x.day,minute:-1,kind:'notes',item:x,overlap:false})});items.sort(function(a,b){return a.day.localeCompare(b.day)||a.minute-b.minute});return items.map(function(v){var x=v.item;if(v.kind==='notes')return '<div class="line"><span>'+x.day+'　'+esc(x.text)+'</span><button data-delete="notes" data-id="'+x.id+'">削除</button></div>';return '<div class="line '+(v.overlap?'overlap':'')+'"><span>'+x.day+'　<span class="entry-time">'+fmt(x.start_minute)+'～'+fmt(x.end_minute)+'</span> '+(v.overlap?'<strong>⚠ 時間が重複しています</strong>':'')+'</span><button data-delete="availability" data-id="'+x.id+'">削除</button></div>'}).join('')||'<p class="muted">まだ日程を入力していません。</p>'}function bulkAdd(){var st=rangeStart,en=rangeEnd;if(!selectedDays.length)return alert('先にカレンダーで日付を選択してください');if(en<=st)return alert('終了は開始より後にしてください');var chosen=selectedDays.slice(),bad=[],overlaps=[];chosen.forEach(function(d){if(data.exclusions.some(function(x){return x.day===d}))bad.push(d);if(data.availability.some(function(x){return x.participant_id===me.id&&x.day===d&&st<x.end_minute&&en>x.start_minute}))overlaps.push(d)});if(bad.length)return alert('主催者が除外した日です：'+bad.join('、')+'\n該当日を選択解除してください。');if(overlaps.length&&!confirm('既存の日程と時間が重なる日があります：'+overlaps.join('、')+'\n重複して登録しますか？'))return;var chain=Promise.resolve();chosen.forEach(function(d){chain=chain.then(function(){return call('add_time_entry',{p_share_id:shareId,p_participant_id:me.id,p_edit_token:token(),p_kind:'availability',p_day:d,p_start_minute:st,p_end_minute:en})})});chain.then(function(){selectedDays=[];load()}).catch(fail)}
function addNote(){var d=selectedDays[0];if(!d)return alert('自由記載する日付を1日選択してください');call('add_note',{p_share_id:shareId,p_participant_id:me.id,p_edit_token:token(),p_day:d,p_text:document.getElementById('note').value}).then(function(){selectedDays=[];load()}).catch(fail)}
function deleteEntry(k,id){if(!confirm('この登録を削除しますか？'))return;call('delete_own_entry',{p_share_id:shareId,p_participant_id:me.id,p_edit_token:token(),p_kind:k,p_entry_id:id}).then(load).catch(fail)}
function allView(){return '<section class="card"><h2>みんなの日程</h2><div class="legend"><span><i class="dot" style="background:#bfe8ce"></i>参加可能</span><span><i class="dot" style="background:#eee5ff"></i>自由記載</span></div>'+dates(S.start_date,S.end_date).map(function(d){var html=people.map(function(p){var a=data.availability.filter(function(x){return x.participant_id===p.id&&x.day===d}),n=data.notes.filter(function(x){return x.participant_id===p.id&&x.day===d});if(!a.length&&!n.length)return '';return '<div class="line"><strong><span style="color:'+palette[p.color_index%palette.length]+'">●</span> '+esc(p.name)+'</strong><span>'+a.map(function(x){return '<span class="chip" style="background:#dff4e6;color:#205f3d">参加可能 '+fmt(x.start_minute)+'～'+fmt(x.end_minute)+'</span>'}).join('')+n.map(function(x){return '<span class="chip" style="background:#eee5ff;color:#5c4093">'+esc(x.text)+'</span>'}).join('')+'</span></div>'}).join('');return html?'<h3>'+d+'</h3>'+html:''}).join('')+'</section>'}
function weekday(d){return ['日','月','火','水','木','金','土'][new Date(d+'T12:00:00').getDay()]}
function candidateKey(x){return x.day+'|'+x.start+'|'+x.end}
function candidateView(){var out=[];if(!people.length)return '<section class="card">まだ日程が集まっていません。</section>';dates(S.start_date,S.end_date).forEach(function(d){var per=people.map(function(p){return data.availability.filter(function(x){return x.participant_id===p.id&&x.day===d}).map(function(x){return [x.start_minute,x.end_minute]})});if(per.some(function(x){return !x.length}))return;var pts=Array.from(new Set([].concat.apply([],per.map(function(xs){return [].concat.apply([],xs)})).concat(data.exclusions.filter(function(x){return x.day===d}).reduce(function(a,x){a.push(x.start_minute,x.end_minute);return a},[])))).sort(function(a,b){return a-b});for(var i=0;i<pts.length-1;i++){var a=pts[i],b=pts[i+1],excluded=data.exclusions.some(function(x){return x.day===d&&x.start_minute<=a&&x.end_minute>=b});if(!excluded&&per.every(function(xs){return xs.some(function(v){return v[0]<=a&&v[1]>=b})})){var last=out[out.length-1];if(last&&last.day===d&&last.end===a)last.end=b;else out.push({day:d,start:a,end:b})}}});candidateCache=out;var total=out.reduce(function(n,x){return n+x.end-x.start},0);return '<section class="card"><h2>みんなが参加できる時間</h2><p>必要 '+S.required_minutes/60+'時間 ／ 共通時間合計 '+total/60+'時間</p><p class="muted">候補にチェックを入れて、必要な日時だけコピーできます。主催者が除外した日時は候補に含まれません。</p><div class="toolbar"><button id="select-all-candidates">すべて選択</button><button id="clear-candidates">選択解除</button><button class="primary" id="copy-candidates">選択した候補をコピー</button></div>'+(out.map(function(x){var k=candidateKey(x);return '<label class="line" style="align-items:center;cursor:pointer"><span><input type="checkbox" data-candidate-pick="'+esc(k)+'" style="width:auto;margin-right:8px" '+(selectedCandidateKeys.indexOf(k)>=0?'checked':'')+'><strong>'+x.day+'（'+weekday(x.day)+'）</strong></span><span>'+fmt(x.start)+'～'+fmt(x.end)+'（'+(x.end-x.start)/60+'時間）</span></label>'}).join('')||'<p>まだ共通候補がありません。</p>')+'</section>'}function saveOrganizer(){var title=document.getElementById('edit-title').value.trim(),start=document.getElementById('edit-start').value,end=document.getElementById('edit-end').value,hours=Number(document.getElementById('edit-hours').value);if(!title||!start||!end||end<start||!hours)return alert('入力内容を確認してください');if(editDays.some(function(d){return d<start||d>end}))return alert('期間外の除外日があります。カレンダーを確認してください。');call('update_schedule_exclusions',{p_share_id:shareId,p_organizer_token:editToken,p_title:title,p_start_date:start,p_end_date:end,p_required_minutes:Math.round(hours*60),p_excluded_days:editDays.map(function(day){return {day:day}})}).then(function(){alert('変更を保存しました');load()}).catch(fail)}function toggleDay(d,kind){var list=kind==='host'?hostSelectedDays:selectedDays,i=list.indexOf(d);if(i>=0)list.splice(i,1);else list.push(d);if(kind==='host')renderHostCalendar();else render()}
document.addEventListener('change',function(e){if(e.target.matches('[data-candidate-pick]')){var k=e.target.getAttribute('data-candidate-pick'),i=selectedCandidateKeys.indexOf(k);if(e.target.checked&&i<0)selectedCandidateKeys.push(k);if(!e.target.checked&&i>=0)selectedCandidateKeys.splice(i,1)}if(e.target.id==='st'){rangeStart=Number(e.target.value);localStorage.setItem('taku-default-start',String(rangeStart))}if(e.target.id==='en'){rangeEnd=Number(e.target.value);localStorage.setItem('taku-default-end',String(rangeEnd))}});
document.addEventListener('click',function(e){var modeBtn=e.target.closest('[data-mode]'),dayBtn=e.target.closest('[data-select-day]'),monthBtn=e.target.closest('[data-month]'),del=e.target.closest('[data-delete]'),hostDel=e.target.closest('[data-host-remove]');if(modeBtn){mode=modeBtn.dataset.mode;selectedDays=[];render()}if(dayBtn){if(dayBtn.dataset.selectDay==='edit'){var ed=dayBtn.dataset.day,idx=editDays.indexOf(ed);if(idx>=0)editDays.splice(idx,1);else editDays.push(ed);render()}else toggleDay(dayBtn.dataset.day,dayBtn.dataset.selectDay)}if(monthBtn){if(monthBtn.dataset.month==='host'){hostMonth=shiftMonth(hostMonth,Number(monthBtn.dataset.delta));renderHostCalendar()}else{viewMonth=shiftMonth(viewMonth,Number(monthBtn.dataset.delta));render()}}if(del)deleteEntry(del.dataset.delete,del.dataset.id);if(hostDel){hostExcluded.splice(Number(hostDel.dataset.hostRemove),1);renderHostCalendar()}var tp=e.target.closest('[data-time-preset]'),rp=e.target.closest('[data-remove-preset]');if(tp)applyPreset(Number(tp.dataset.timePreset));if(rp)removePreset(Number(rp.dataset.removePreset));if(e.target.id==='save-preset')saveCurrentPreset();if(e.target.id==='join')join();if(e.target.id==='bulk-add')bulkAdd();if(e.target.id==='back-home')location.href=location.pathname;if(e.target.id==='toggle-organizer'){location.href='?id='+encodeURIComponent(shareId)}if(e.target.id==='copy-participant')navigator.clipboard.writeText(location.origin+location.pathname+'?id='+encodeURIComponent(shareId)).then(function(){alert('参加者用URLをコピーしました')}).catch(fail);if(e.target.id==='copy-editor')navigator.clipboard.writeText(location.origin+location.pathname+'?id='+encodeURIComponent(shareId)+'&edit='+encodeURIComponent(editToken)).then(function(){alert('編集用URLをコピーしました。主催者だけで保管してください')}).catch(fail);if(e.target.id==='save-organizer')saveOrganizer();if(e.target.id==='save-note')addNote();if(e.target.id==='select-all-candidates'){selectedCandidateKeys=candidateCache.map(candidateKey);render()}if(e.target.id==='clear-candidates'){selectedCandidateKeys=[];render()}if(e.target.id==='copy-candidates'){var chosen=candidateCache.filter(function(x){return selectedCandidateKeys.indexOf(candidateKey(x))>=0});if(!chosen.length){alert('コピーする候補にチェックを入れてください');return}var totalMinutes=chosen.reduce(function(sum,x){return sum+(x.end-x.start)},0);var txt=chosen.map(function(x){return x.day+'（'+weekday(x.day)+'） '+fmt(x.start)+'～'+fmt(x.end)+'（'+(x.end-x.start)/60+'時間）'}).join('\n')+'\n\n選択した候補の合計：'+Math.floor(totalMinutes/60)+'時間'+(totalMinutes%60?''+totalMinutes%60+'分':'');navigator.clipboard.writeText(txt).then(function(){alert('選択した候補をコピーしました')}).catch(fail)}if(e.target.id==='clear-selection'){selectedDays=[];render()}if(e.target.id==='switch-person'){if(confirm('この端末の回答者情報を解除します。登録済みの回答は削除されません。別の名前で回答できます。')){localStorage.removeItem('taku-token-'+shareId);localStorage.removeItem('taku-person-'+shareId);me=null;selectedDays=[];render()}}if(e.target.id==='host-add'){if(!hostSelectedDays.length)return alert('除外する日付を選択してください');hostSelectedDays.forEach(function(d){if(!hostExcluded.some(function(x){return x.day===d}))hostExcluded.push({day:d,start_minute:0,end_minute:1620})});hostSelectedDays=[];renderHostCalendar()}var os=e.target.closest('[data-open-share]'),oe=e.target.closest('[data-open-edit]'),rm=e.target.closest('[data-remove-managed]');if(os){var a=getManaged()[Number(os.dataset.openShare)];if(a)location.href='?id='+encodeURIComponent(a.share_id)}if(oe){var b=getManaged()[Number(oe.dataset.openEdit)];if(b)location.href='?id='+encodeURIComponent(b.share_id)+'&edit='+encodeURIComponent(b.organizer_token)}if(rm){var list=getManaged();list.splice(Number(rm.dataset.removeManaged),1);saveManaged(list);createView()}});
var hostAddObserver=new MutationObserver(function(){var cal=document.getElementById('host-calendar');if(cal&&!document.getElementById('host-add')){var b=document.createElement('p');b.innerHTML='<button class="mode-exclusion" id="host-add">選択した日付を除外する</button>';cal.appendChild(b)}});
hostAddObserver.observe(app,{childList:true,subtree:true});
init();
})();
</script></main></body></html>
